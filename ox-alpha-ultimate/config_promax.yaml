# OX-ALPHA PRIME — multi-agent configuration
# Small-capital paper profile: ₹5,000 total, split across specialist agents.
# Every agent is independent: own universe, own risk, own schedule, own budget.
# Buys always wait for human approval (run.py approve <iid>); sells never wait.

mode: paper
platform: paper
db_path: promax.db
paper_seed: 11
monitor_interval_seconds: 10

capital:
  total: 5000
  weights:
    intraday_scalper: 0.12      # 600 — intense intraday on low-cost stocks
    equity_momentum: 0.10       # 500 — trend riders, low-cost universe
    equity_growth: 0.14         # 700 — short+long horizon growth picker
    options_0dte: 0.10          # 500 — defined-risk spreads, weekly expiry days
    market_maker: 0.08          # 400 — paper spread capture
    crypto_perp: 0.16           # 800 — perp momentum/MR, ladder-gated leverage
    crypto_funding: 0.10        # 500 — funding-rate arb, market-neutral
    crypto_meme_swing: 0.10     # 500 — meme/low-cap swings, social-triggered
    news_intel: 0.05            # 250 — intelligence (no positions)
    social_monitor: 0.05        # 250 — intelligence (no positions)

approval:
  ttl_seconds: 300              # stale approvals never execute

# Leverage is EARNED: every agent starts at 25% of its platform cap
# (level 1) and climbs only on closed-trade evidence + Monte-Carlo survival.
ladder:
  enabled: true
  min_trades: 20
  min_profit_factor: 1.3
  min_win_rate: 0.5
  max_recent_drawdown: 0.15
  start_fraction: 0.25
  step_multiple: 2.0
  max_level: 3
  ruin_prob_max: 0.05
  eval_minutes: 30

risk:
  global_limits:
    max_total_leverage: 5.0
    max_single_position_pct: 0.15
    max_daily_loss_pct: 0.03
    max_drawdown_pct: 0.15

# Live crypto (optional): with mode: live, crypto agents trade real Binance.
# Swap symbols use USDT-M perpetuals (leverage ladder + real funding rates);
# spot symbols are cash-only and refuse leveraged orders.  Credentials come
# from BINANCE_API_KEY / BINANCE_API_SECRET env vars (configurable below) and
# live mode additionally requires OX_LIVE_EXECUTION_APPROVED=YES_I_UNDERSTAND_LIVE_TRADING.
crypto:
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET
  markets:
    BTCUSDT: swap
    ETHUSDT: swap
    SOLUSDT: swap
    PEPEUSDT: spot
    WIFUSDT: spot
    BONKUSDT: spot

data_pump:
  interval_seconds: 5

# Paper starting prices — deliberately LOW-COST, liquid NSE names (₹20-₹140)
# so intraday sizing works with a few hundred rupees instead of NIFTY50
# heavyweights that cost thousands per share.  Live mode replaces these with
# real broker quotes.
paper_prices:
  YESBANK: 21.5
  IDFCFIRSTB: 71.0
  SUZLON: 62.0
  IRFC: 135.0
  IOB: 55.0
  CANBK: 105.0
  NIFTY: 24200.0
  BANKNIFTY: 52100.0

agents:
  # ── equity specialists ─────────────────────────────────────────────
  intraday_scalper:
    type: intraday_scalper
    name: Intraday Scalper
    enabled: true
    priority: 1
    symbols: [YESBANK, IDFCFIRSTB, SUZLON, IRFC, IOB, CANBK]
    active_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:20", end: "15:10"}
    risk:
      max_leverage: 1.0          # NSE equity intraday MIS ~5x at brokers; stay conservative
      max_position_pct: 0.10
      max_daily_loss_pct: 0.02
      max_concurrent_positions: 3
    params:
      max_hold_minutes: 45

  equity_momentum:
    type: equity_momentum
    name: Equity Momentum
    enabled: true
    priority: 2
    symbols: [SUZLON, IRFC, CANBK, IDFCFIRSTB]
    active_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "15:00"}
    risk:
      max_leverage: 1.0
      max_position_pct: 0.15
      max_daily_loss_pct: 0.02
      max_concurrent_positions: 3

  equity_growth:
    type: equity_growth
    name: Equity Growth (short)
    enabled: true
    priority: 2
    symbols: [SUZLON, IRFC, CANBK, IOB]
    active_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "15:00"}
    risk:
      max_leverage: 1.0
      max_position_pct: 0.15
      max_daily_loss_pct: 0.02
      max_concurrent_positions: 2
    params:
      horizon: short
      risk_per_trade: 0.15        # small-capital: ~₹105 per trade so qty >= 1 share

  # ── derivatives (defined risk only) ────────────────────────────────
  options_0dte:
    type: options_0dte
    name: 0DTE Options Spreads
    enabled: true
    priority: 1
    symbols: [NIFTY]
    active_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "15:05"}
    risk:
      max_leverage: 10.0         # defined-risk spread ratio, loss capped at debit
      max_position_pct: 0.05
      max_daily_loss_pct: 0.03
      max_concurrent_positions: 2
    params:
      entry_start: "09:35"
      entry_end: "14:30"
      squareoff: "15:05"

  market_maker:
    type: market_maker
    name: Paper Market Maker
    enabled: true
    priority: 4
    symbols: [YESBANK, IOB]
    active_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:20", end: "15:15"}
    risk:
      max_leverage: 1.0
      max_position_pct: 0.05
      max_daily_loss_pct: 0.01
      max_concurrent_positions: 2

  # ── crypto specialists (small size, ladder-gated leverage) ─────────
  crypto_perp:
    type: crypto_perp
    name: Crypto Perp Momentum
    enabled: true
    priority: 2
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
    active_hours: {always: true}
    risk:
      max_leverage: 10.0         # platform cap; ladder starts agents at 2.5x
      max_position_pct: 0.20
      max_daily_loss_pct: 0.05
      max_concurrent_positions: 2

  crypto_funding:
    type: crypto_funding
    name: Funding Rate Arb
    enabled: true
    priority: 3
    symbols: [BTCUSDT, ETHUSDT]
    active_hours: {always: true}
    risk:
      max_leverage: 5.0          # ladder starts at 1.25x
      max_position_pct: 0.25
      max_daily_loss_pct: 0.02
      max_concurrent_positions: 2

  crypto_meme_swing:
    type: crypto_meme_swing
    name: Meme / Low-Cap Swing
    enabled: true
    priority: 3
    symbols: [PEPEUSDT, WIFUSDT, BONKUSDT]
    active_hours: {always: true}
    risk:
      max_leverage: 5.0
      max_position_pct: 0.10
      max_daily_loss_pct: 0.10
      max_concurrent_positions: 2

  # ── intelligence (no positions; shared services) ───────────────────
  news_intel:
    type: news_intel
    name: News Intelligence
    enabled: true
    priority: 5
    symbols: [SUZLON, IRFC, CANBK, IOB, YESBANK]
    active_hours: {always: true}
    risk: {max_leverage: 1.0, max_concurrent_positions: 0}
    params:
      poll_interval_seconds: 180
      lookback_minutes: 240
      rss_sources:
        - {name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms", topic: markets}
        - {name: GoogleNSE, url: "https://news.google.com/rss/search?q=NSE+India+markets&hl=en-IN&gl=IN&ceid=IN:en", topic: markets}
        - {name: CoinDesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", topic: crypto}
        - {name: Cointelegraph, url: "https://cointelegraph.com/rss", topic: crypto}
      x_queries: []              # set with OX_X_BEARER env token to activate
      telegram_channels: []      # e.g. [cointelegraph]
      nitter: {instance: "", handles: []}

  social_monitor:
    type: social_monitor
    name: Social Monitor
    enabled: true
    priority: 5
    symbols: []
    active_hours: {always: true}
    risk: {max_leverage: 1.0, max_concurrent_positions: 0}
    params:
      poll_interval_seconds: 120
      spike_multiple: 3.0
      min_mentions: 2
      watch:
        PEPEUSDT: [pepe, pepecoin]
        WIFUSDT: [dogwifhat, wif]
        BONKUSDT: [bonk]
        BTCUSDT: [bitcoin, btc]
        ETHUSDT: [ethereum, eth]
      telegram_channels: []
      x_queries: []
      nitter: {instance: "", handles: []}
