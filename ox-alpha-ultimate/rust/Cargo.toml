[package]
name = "oxalpha-risk"
version = "0.1.0"
edition = "2021"
description = "Safety-critical risk engine for OxAlpha trading system"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.34", features = ["full", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Math & Statistics
nalgebra = "0.32"
statrs = "0.16"
ndarray = { version = "0.15", features = ["serde"] }
num-traits = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Logging
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "5.5"
atomic = "0.1"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Network
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Testing
[dev-dependencies]
proptest = "1.0"
mockall = "0.11"

[features]
default = []
simd = ["nalgebra/simd"]