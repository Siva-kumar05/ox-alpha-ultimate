[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxalpha"
version = "0.1.0"
description = "Pro Max Multi-Agent Trading System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OxAlpha Team"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Core
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    
    # Async & Concurrency
    "asyncio-mqtt>=0.16",
    "aiokafka>=0.8",
    "aiohttp>=3.9",
    "websockets>=12.0",
    
    # Data & ML
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "arch>=7.0",
    "ta-lib>=0.4",
    
    # Visualization
    "plotly>=5.17",
    "matplotlib>=3.8",
    
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    "redis>=5.0",
    
    # Monitoring
    "prometheus-client>=0.19",
    "structlog>=24.1",
    
    # Utilities
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
gpu = [
    "cupy-cuda12x>=13.0",
    "cudf-cu12>=23.10",
]
gpu = [
    "cupy-cuda12x>=13.0",
    "cudf-cu12>=23.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxalpha*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["SIM102", "SIM103", "T201", "T203"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true